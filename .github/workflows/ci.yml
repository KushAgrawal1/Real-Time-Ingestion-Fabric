name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dag-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest
      - name: Test quality_checks (no Airflow needed - see dags/quality_checks.py)
        run: cd dags && python -m pytest tests/ -v

  spark-validation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r spark/tests/requirements-test.txt
      - name: Test validation rules
        env:
          PYSPARK_PYTHON: python3.11
          PYSPARK_DRIVER_PYTHON: python3.11
        run: cd spark && python -m pytest tests/ -v
