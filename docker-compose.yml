services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    mem_limit: 400m
    healthcheck:
      test: ['CMD', 'bash', '-c', "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - confluent

  broker:
    image: confluentinc/cp-server:7.4.0
    hostname: broker
    container_name: broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: 'false'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
      KAFKA_HEAP_OPTS: "-Xmx640M -Xms640M"
    mem_limit: 1g
    networks:
      - confluent
    healthcheck:
      test: ["CMD", "bash", "-c", 'nc -z localhost 9092']
      interval: 10s
      timeout: 5s
      retries: 5

  
  kafka-init:
    image: confluentinc/cp-server:7.4.0
    container_name: kafka-init
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --replication-factor 1 --partitions 6 --topic tfl.arrivals.raw
        kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --replication-factor 1 --partitions 6 --topic tfl.arrivals.clean
        kafka-topics --list --bootstrap-server broker:29092
        echo "topics ready"
    networks:
      - confluent

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    hostname: schema-registry
    container_name: schema-registry
    profiles: ["registry"]
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - confluent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Control Center is the hungriest container in the stack and is amd64-only,
  # so it runs under emulation on Apple Silicon. Start it by name only when you
  # actually want the topic throughput view:  docker compose up -d control-center
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.4.0
    hostname: control-center
    container_name: control-center
    profiles: ["monitoring"]
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONFLUENT_METRICS_ENABLE: 'false'
      PORT: 9021
    mem_limit: 2g
    networks:
      - confluent

  # --------------------------------------------------------------------------
  # Cassandra + schema bootstrap
  #
  # 4.1 rather than 5.0: lighter startup, and the version most shops run.
  # MAX_HEAP_SIZE and HEAP_NEWSIZE must be set as a PAIR - cassandra-env.sh
  # refuses to start with only one of them under CMS GC. Leaving both unset is
  # worse: Cassandra sizes its heap from host RAM and ignores the cgroup limit,
  # so it overshoots mem_limit and gets SIGKILLed (exit 137).
  # --------------------------------------------------------------------------
  cassandra_db:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
      - CASSANDRA_CLUSTER_NAME=rtif
    mem_limit: 1200m
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - confluent

  cassandra-init:
    image: cassandra:4.1
    container_name: cassandra-init
    depends_on:
      cassandra_db:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql:ro
    command: ["cqlsh", "cassandra", "-f", "/init.cql"]
    networks:
      - confluent

  # --------------------------------------------------------------------------
  # Continuously running producer. Not scheduled by Airflow - a stream is a
  # service, not a cron job.
  # --------------------------------------------------------------------------
  tfl-producer:
    build: ./producer
    container_name: tfl-producer
    depends_on:
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      RAW_TOPIC: tfl.arrivals.raw
      TFL_BASE_URL: https://api.tfl.gov.uk
      TFL_MODES: ${TFL_MODES:-tube}
      TFL_APP_KEY: ${TFL_APP_KEY:-}
      POLL_SECONDS: ${POLL_SECONDS:-30}
    mem_limit: 150m
    restart: unless-stopped
    networks:
      - confluent

  # --------------------------------------------------------------------------
  # Streaming jobs. --master local[2] inside each container is the reliable
  # default on a laptop; point it at spark://spark-master:7077 to use the
  # cluster instead. That is the only line that changes.
  #
  # restart: "no" while stabilising - a restart loop buries the first real
  # error under thousands of lines of collapse debris. Switch back to
  # unless-stopped once the job runs clean.
  # --------------------------------------------------------------------------
  spark-stream:
    image: apache/spark:3.5.0
    container_name: spark-stream
    user: root                     # dev-only shortcut for the ivy cache
    depends_on:
      broker:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    volumes:
      - ./spark:/opt/spark-apps:ro
      - spark-ivy:/tmp/.ivy2
      - spark-checkpoints:/tmp/checkpoints
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      CASSANDRA_HOST: cassandra
      RAW_TOPIC: tfl.arrivals.raw
      CLEAN_TOPIC: tfl.arrivals.clean
      STARTING_OFFSETS: latest
      CHECKPOINT_ROOT: /tmp/checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 900m
      --conf spark.jars.ivy=/tmp/.ivy2
      --conf spark.cassandra.connection.host=cassandra
      --conf spark.cassandra.connection.port=9042
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0
      --py-files /opt/spark-apps/common.py
      /opt/spark-apps/bronze_silver.py
    mem_limit: 1400m
    restart: "no"
    networks:
      - confluent

  spark-gold:
    image: apache/spark:3.5.0
    container_name: spark-gold
    user: root
    depends_on:
      broker:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    volumes:
      - ./spark:/opt/spark-apps:ro
      - spark-ivy:/tmp/.ivy2
      - spark-checkpoints:/tmp/checkpoints
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      CASSANDRA_HOST: cassandra
      CLEAN_TOPIC: tfl.arrivals.clean
      STARTING_OFFSETS: latest
      CHECKPOINT_ROOT: /tmp/checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 900m
      --conf spark.jars.ivy=/tmp/.ivy2
      --conf spark.cassandra.connection.host=cassandra
      --conf spark.cassandra.connection.port=9042
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0
      --py-files /opt/spark-apps/common.py
      /opt/spark-apps/gold.py
    mem_limit: 1400m
    restart: "no"
    networks:
      - confluent

  # Idle JVMs unless you flip --master over, so they sit behind a profile and
  # will not start with a bare `docker compose up`.
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    profiles: ["cluster"]
    command: bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"
      - "7077:7077"
    networks:
      - confluent

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    profiles: ["cluster"]
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_MASTER_URL: spark://spark-master:7077
    networks:
      - confluent

  # --------------------------------------------------------------------------
  # Airflow: batch and operational orchestration only
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:14.0
    container_name: postgres
    profiles: ["airflow"]
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - confluent

  webserver:
    image: apache/airflow:2.6.0-python3.9
    container_name: airflow-webserver
    profiles: ["airflow"]
    command: webserver
    entrypoint: ['/opt/airflow/script/entrypoint.sh']
    depends_on:
      - postgres
    environment:
      - LOAD_EX=n
      - EXECUTOR=Sequential
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW_WEBSERVER_SECRET_KEY=this_is_a_very_secured_key
      - CASSANDRA_HOST=cassandra
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./script/entrypoint.sh:/opt/airflow/script/entrypoint.sh
      - ./requirements.txt:/opt/airflow/requirements.txt
    ports:
      - "8080:8080"
    healthcheck:
      test: ['CMD-SHELL', "[ -f /opt/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - confluent

  scheduler:
    image: apache/airflow:2.6.0-python3.9
    container_name: airflow-scheduler
    profiles: ["airflow"]
    depends_on:
      webserver:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./script/entrypoint.sh:/opt/airflow/script/entrypoint.sh
      - ./requirements.txt:/opt/airflow/requirements.txt
    environment:
      - LOAD_EX=n
      - EXECUTOR=Sequential
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW_WEBSERVER_SECRET_KEY=this_is_a_very_secured_key
      - CASSANDRA_HOST=cassandra
    command: bash -c "pip install -r ./requirements.txt && airflow db upgrade && airflow scheduler"
    networks:
      - confluent

networks:
  confluent:

volumes:
  cassandra-data:
  spark-ivy:
  spark-checkpoints:
